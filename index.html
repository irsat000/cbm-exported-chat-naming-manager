<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Naming Manager</title>
<style>
:root{--bg:#f4f5f2;--panel:#fff;--ink:#1d2321;--mute:#69726e;--line:#dde1dc;--acc:#0f6b5c;--acc-ink:#fff;--sel:#e3f1ed;--warn:#b3361f}
@media (prefers-color-scheme:dark){:root{--bg:#161a19;--panel:#202625;--ink:#e8ece9;--mute:#9aa6a1;--line:#343d3b;--acc:#4fb8a3;--acc-ink:#0d1816;--sel:#1f3430;--warn:#ff8a73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--panel)}
h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px;margin:26px 0 10px;font-weight:650}
main{padding:0 24px 60px;max-width:1300px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.danger{color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
input[type=text],select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
.sp{flex:1}
.drop{margin-top:18px;border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mute)}
.drop.over{border-color:var(--acc);background:var(--sel)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.file{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.file b{font-weight:600}.file span{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card.sel{background:var(--sel);border-color:var(--acc)}
.card.over{outline:2px dashed var(--acc)}
.top{display:flex;gap:10px;align-items:center}
.top .nm{flex:1;min-width:0;font-weight:600;width:100%}
.av{width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}
.meta{color:var(--mute);font-size:12px;margin-top:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{font-size:12px;padding:3px 8px}
.picks{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.picks img{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid transparent}
.picks img:hover{border-color:var(--acc)}
details{margin-top:10px}summary{cursor:pointer;color:var(--mute);font-size:12px}
.mem{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.mem .t{flex:1;min-width:0}.mem select{max-width:130px;font-size:12px;padding:2px 4px}
.empty{color:var(--mute);padding:24px;text-align:center}
.note{color:var(--mute);font-size:12px}
.err{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>Chat naming manager</h1>
  <span class="note">Import saved chats, rename and merge authors, replace avatars, export.</span>
</header>
<main>
  <div class="drop" id="drop">
    Drop saved chat .html or .json files here, or
    <button id="imp" class="pri">Import files</button>
    <input type="file" id="fin" accept=".html,.htm,.json" multiple hidden>
    <div class="err" id="msg"></div>
  </div>
  <div class="files" id="files"></div>
  <div class="bar" id="expbar" hidden>
    <input type="text" id="mtitle" placeholder="Title for merged export">
    <button id="expm" class="pri">Export merged file</button>
    <button id="expa">Export each file</button>
  </div>

  <h2>Users</h2>
  <div class="bar" style="margin-top:0">
    <input type="text" id="q" placeholder="Search names or sources">
    <button id="merge" disabled>Merge selected</button>
    <button id="clr">Clear selection</button>
    <span class="note">Tick cards and merge, or drag one card onto another.</span>
  </div>
  <div class="grid" id="humans" style="margin-top:12px"></div>

  <h2>Bots</h2>
  <div class="note" style="margin-bottom:10px">Bots can be renamed and given avatars, but not grouped.</div>
  <div class="grid" id="bots"></div>
</main>
<input type="file" id="avin" accept="image/*" hidden>

const par=r=>S.files[r.f].data.history[r.c].participants[r.i];
const cnt=r=>{const id=par(r).id;return S.files[r.f].data.history[r.c].content.filter(m=>m.author===id).length};
const all=()=>[...S.groups,...S.bots];
const find=id=>all().find(e=>e.id===id);
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 38% 42%)`};

/* ---------- import ---------- */
function parseText(text){
  const re=/((?:let historyData|window\.__CAI_HISTORY_RAW__)\s*=\s*`)([\s\S]*?)(`;)/;
  const m=text.match(re);
  let raw=text,tpl=null;
  if(m){raw=m[2];tpl=text.replace(re,(x,p,d,q)=>p+PH+q)}
  if(raw.includes(PH)||!raw.trim())return{tpl,data:null};
  let d;
  try{d=JSON.parse(decodeURIComponent(raw))}catch(e){d=JSON.parse(raw)}
  if(!d||!Array.isArray(d.history))throw new Error('unrecognized chat structure (top-level keys: '+Object.keys(d||{}).join(', ')+')');
  return{tpl,data:d};
}
async function importFiles(list){
  const out=[];
  for(const f of list){
    try{
      const {tpl,data}=parseText(await f.text());
      if(!data){out.push(`${f.name}: this is an empty shell, its data placeholder was never filled in. Import a chat saved with data.`);continue}
      const id=S.nid++;
      S.files[id]={id,name:f.name,data,tpl};
      data.history.forEach((ch,c)=>ch.participants.forEach((p,i)=>addRef({f:id,c,i},p)));
    }catch(e){out.push(`${f.name}: ${e.message}`)}
  }
  $('#msg').textContent=out.join(' ');
  render();
}
function addRef(ref,p){
  if(p.is_human){
    const k=String(p.name||'').trim().toLowerCase();
    let g=S.groups.find(g=>g.members.some(r=>String(par(r).name||'').trim().toLowerCase()===k));
    if(!g){g={id:'g'+S.nid++,name:p.name||'User',avatar:p.avatar||null,members:[]};S.groups.push(g)}
    if(!g.avatar&&p.avatar)g.avatar=p.avatar;
    g.members.push(ref);
  }else{
    let b=S.bots.find(b=>b.fid===ref.f&&b.orig===p.name);
    if(!b){b={id:'b'+S.nid++,fid:ref.f,orig:p.name,name:p.name||'Bot',avatar:p.avatar||null,members:[],bot:true};S.bots.push(b)}
    if(!b.avatar&&p.avatar)b.avatar=p.avatar;
    b.members.push(ref);
  }
}
function removeFile(id){
  delete S.files[id];
  S.groups.forEach(g=>g.members=g.members.filter(r=>r.f!==id));
  S.bots.forEach(b=>b.members=b.members.filter(r=>r.f!==id));
  prune();render();
}
function prune(){
  S.groups=S.groups.filter(g=>g.members.length);
  S.bots=S.bots.filter(b=>b.members.length);
  S.sel.forEach(id=>{if(!find(id))S.sel.delete(id)});
}

/* ---------- editing ---------- */
function merge(ids,targetId){
  const t=S.groups.find(g=>g.id===targetId);
  if(!t)return;
  ids.filter(i=>i!==targetId).forEach(i=>{
    const g=S.groups.find(g=>g.id===i);
    if(!g)return;
    t.members.push(...g.members);
    if(!t.avatar&&g.avatar)t.avatar=g.avatar;
    g.members=[];
  });
  S.sel.clear();prune();render();
}
function moveMember(ref,to){
  const from=S.groups.find(g=>g.members.includes(ref));
  let dest;
  if(to==='new'){dest={id:'g'+S.nid++,name:par(ref).name||'User',avatar:par(ref).avatar||null,members:[]};S.groups.push(dest)}
  else dest=S.groups.find(g=>g.id===to);
  if(!from||!dest||from===dest)return;
  from.members.splice(from.members.indexOf(ref),1);
  dest.members.push(ref);
  prune();render();
}
function toAvatar(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(img.width,img.height),c=document.createElement('canvas');
      c.width=c.height=256;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
      URL.revokeObjectURL(u);
      res(file.type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.9));
    };
    img.onerror=()=>rej(new Error('Could not read that image.'));
    img.src=u;
  });
}

/* ---------- render ---------- */
function avatarEl(e){
  return e.avatar?`<img class="av" src="${esc(e.avatar)}" alt="">`
    :`<div class="av" style="background:${hue(e.name||'?')}">${esc((e.name||'?').trim().charAt(0).toUpperCase())}</div>`;
}
function card(e){
  const msgs=e.members.reduce((n,r)=>n+cnt(r),0);
  const srcs=new Set(e.members.map(r=>r.f+'-'+r.c)).size;
  const pics=S.pick===e.id?[...new Set(e.members.map(r=>par(r).avatar).filter(Boolean))]:null;
  const opts=g=>S.groups.filter(x=>x!==g).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  const members=e.members.map(r=>{
    const f=S.files[r.f],ch=f.data.history[r.c],p=par(r);
    const d=ch.create_date?new Date(ch.create_date).toLocaleDateString():'';
    const idx=`data-f="${r.f}" data-c="${r.c}" data-i="${r.i}"`;
    const mv=e.bot?'':`<select class="mv" ${idx}><option value="">Move to…</option>${opts(e)}<option value="new">New user</option></select>`;
    return `<div class="mem"><div class="t">${esc(f.name)}, chat ${r.c+1}${d?' ('+esc(d)+')':''}<br><span class="note">was “${esc(p.name)}”, ${cnt(r)} messages</span></div>${mv}</div>`;
  }).join('');
  return `<div class="card ${S.sel.has(e.id)?'sel':''}" data-id="${e.id}" ${e.bot?'':'draggable="true"'}>
    <div class="top">
      ${e.bot?'':`<input type="checkbox" class="ck" aria-label="Select ${esc(e.name)}" ${S.sel.has(e.id)?'checked':''}>`}
      ${avatarEl(e)}
      <div style="flex:1;min-width:0"><input type="text" class="nm" value="${esc(e.name)}" aria-label="Display name">
      <div class="meta">${msgs} messages in ${srcs} chat${srcs===1?'':'s'}</div></div>
    </div>
    <div class="acts">
      <button data-a="up">Upload avatar</button>
      <button data-a="pick">From chats</button>
      <button data-a="rm" class="danger" ${e.avatar?'':'disabled'}>Remove avatar</button>
    </div>
    ${pics?`<div class="picks">${pics.length?pics.map(a=>`<img src="${esc(a)}" data-a="use" alt="Avatar option">`).join(''):'<span class="note">No avatars found in the source chats.</span>'}</div>`:''}
    <details><summary>Sources (${e.members.length})</summary>${members}</details>
  </div>`;
}
function render(){
  const fl=Object.values(S.files);
  $('#files').innerHTML=fl.map(f=>`<div class="file"><b>${esc(f.name)}</b><span>${f.data.history.length} chat${f.data.history.length===1?'':'s'}</span><span class="sp"></span><button data-ef="${f.id}">Export</button><button data-rf="${f.id}" class="danger">Remove</button></div>`).join('');
  $('#expbar').hidden=!fl.length;
  const q=S.q.toLowerCase();
  const hs=S.groups.filter(g=>!q||g.name.toLowerCase().includes(q)||g.members.some(r=>(par(r).name||'').toLowerCase().includes(q)||S.files[r.f].name.toLowerCase().includes(q)));
  $('#humans').innerHTML=hs.map(card).join('')||'<div class="empty">No users yet. Import a chat to begin.</div>';
  $('#bots').innerHTML=S.bots.map(card).join('')||'<div class="empty">No bots yet.</div>';
  $('#merge').disabled=S.sel.size<2;
  $('#merge').textContent=S.sel.size>1?`Merge ${S.sel.size} selected`:'Merge selected';
}

/* ---------- export ---------- */
function build(f){
  const owner=new Map();
  all().forEach(e=>e.members.forEach(r=>owner.set(`${r.f}|${r.c}|${r.i}`,e)));
  const d=structuredClone(S.files[f].data);
  d.history.forEach((ch,c)=>{
    const canon=new Map(),remap=new Map(),out=[];
    ch.participants.forEach((p,i)=>{
      const e=owner.get(`${f}|${c}|${i}`);
      if(!e){out.push(p);return}
      if(!canon.has(e)){
        canon.set(e,p.id);
        const np={...p,name:e.name};
        if(e.avatar)np.avatar=e.avatar;else delete np.avatar;
        out.push(np);
      }
      remap.set(p.id,canon.get(e));
    });
    ch.participants=out;
    ch.content.forEach(m=>{if(remap.has(m.author))m.author=remap.get(m.author)});
  });
  return d;
}
function download(name,data,tpl){
  const html=(tpl||SHELL).replace(PH,()=>encodeURIComponent(JSON.stringify(data)));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const outName=n=>n.replace(/\.html?$/i,'').replace(/\.json$/i,'')+'-renamed.html';

/* ---------- events ---------- */
$('#imp').onclick=()=>$('#fin').click();
$('#fin').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
const dz=$('#drop');
['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();dz.classList.add('over')}}));
['dragleave','drop'].forEach(t=>dz.addEventListener(t,()=>dz.classList.remove('over')));
dz.addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();importFiles([...e.dataTransfer.files])}});
$('#q').oninput=e=>{S.q=e.target.value;render()};
$('#clr').onclick=()=>{S.sel.clear();render()};
$('#merge').onclick=()=>{
  const order=S.groups.filter(g=>S.sel.has(g.id)).map(g=>g.id);
  merge(order,order[0]);
};
$('#expa').onclick=()=>Object.values(S.files).forEach((f,n)=>setTimeout(()=>download(outName(f.name),build(f.id),f.tpl),n*400));
$('#expm').onclick=()=>{
  const fl=Object.values(S.files);if(!fl.length)return;
  const d=structuredClone(build(fl[0].id));
  fl.slice(1).forEach(f=>d.history.push(...build(f.id).history));
  if($('#mtitle').value.trim())d.title=$('#mtitle').value.trim();
  download('merged-chats.html',d,fl[0].tpl);
};
document.addEventListener('click',async e=>{
  const ef=e.target.closest('[data-ef]'),rf=e.target.closest('[data-rf]');
  if(ef){const f=S.files[ef.dataset.ef];download(outName(f.name),build(f.id),f.tpl);return}
  if(rf){removeFile(+rf.dataset.rf);return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const el=find(b.closest('.card').dataset.id);
  const a=b.dataset.a;
  if(a==='up'){S.avTarget=el;$('#avin').click()}
  else if(a==='rm'){el.avatar=null;render()}
  else if(a==='pick'){S.pick=S.pick===el.id?null:el.id;render()}
  else if(a==='use'){el.avatar=b.getAttribute('src');S.pick=null;render()}
});
$('#avin').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!S.avTarget)return;
  try{S.avTarget.avatar=await toAvatar(f);$('#msg').textContent='';render()}
  catch(err){$('#msg').textContent=err.message}
};
document.addEventListener('change',e=>{
  const t=e.target,c=t.closest('.card');
  if(t.classList.contains('nm')){const el=find(c.dataset.id);el.name=t.value.trim()||el.name;render()}
  else if(t.classList.contains('ck')){const id=c.dataset.id;t.checked?S.sel.add(id):S.sel.delete(id);render()}
  else if(t.classList.contains('mv')&&t.value){
    moveMember(S.groups.flatMap(g=>g.members).find(r=>r.f==t.dataset.f&&r.c==t.dataset.c&&r.i==t.dataset.i),t.value);
  }
});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card[draggable]');if(c){dragId=c.dataset.id;e.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.card[draggable]');if(c&&dragId){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.card');if(c)c.classList.remove('over')});
document.addEventListener('drop',e=>{
  const c=e.target.closest&&e.target.closest('.card[draggable]');
  if(!c||!dragId)return;
  e.preventDefault();
  const ids=S.sel.has(dragId)?[...S.sel]:[dragId];
  merge(ids,c.dataset.id);dragId=null;
});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
render();
</script>
</body>
</html>
